name: Bug report
description: Something in SHER-Input is broken or behaves incorrectly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: check `ARCHITECTURE.md`'s "Phased scope" table and
        "What's intentionally not here yet" section, and `ROADMAP_HONEST.md`
        — a lot of missing functionality (touch/tablet/gamepad backends,
        `inotify`-based hotplug, driver sandboxing, fuzzing) is a known,
        already-documented gap rather than a bug.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true

  - type: input
    id: crate
    attributes:
      label: Affected crate/file
      description: e.g. `crates/linux/src/linux/reader.rs`
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A code snippet, test, or exact command that reproduces it.
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS, and if Linux, whether it was run natively or in a container.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: git commit hash or Cargo.toml version you're on.
    validations:
      required: true
