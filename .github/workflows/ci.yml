name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ubuntu-latest is the important leg: sher_input_linux's real evdev backend
  # (crates/linux/src/linux/**) only compiles under cfg(target_os = "linux") — on
  # macOS it's a stub (crates/linux/src/unsupported.rs). This is the one job that
  # actually compiles and tests the Linux backend's real logic, not the stub.
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --workspace
        run: cargo build --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # This job is allowed to fail the workflow — a real advisory hit or a
    # transient advisory-database fetch failure both surface as a red X here
    # on purpose. Do not add continue-on-error/|| true to silence it; if it
    # fails, either fix the dependency or investigate the fetch failure.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        run: cargo audit
